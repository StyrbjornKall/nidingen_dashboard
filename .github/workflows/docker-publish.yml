name: Build & Push Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"          # also trigger on semantic version tags, e.g. v1.2.3
  pull_request:           # tests and a build check, nothing is pushed

jobs:
  # The real database is not in the repo, so CI runs the fixture-based suites
  # (backend pytest, frontend typecheck and Vitest). The Playwright and smoke
  # tests need the real database and run locally (see CLAUDE.md).
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Backend tests
        run: |
          uv sync --frozen
          uv run pytest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend typecheck and unit tests
        run: |
          npm --prefix web ci
          npm --prefix web run typecheck
          npm --prefix web test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Generate image metadata / tags ────────────────────────────────────
      # Produces tags such as:
      #   styrbjornkall/nidingen-dashboard:main          (branch name)
      #   styrbjornkall/nidingen-dashboard:20260226      (push date)
      #   styrbjornkall/nidingen-dashboard:sha-abc1234   (short commit SHA)
      #   styrbjornkall/nidingen-dashboard:v1.2.3        (semver tag, if pushed)
      #   styrbjornkall/nidingen-dashboard:latest        (only on semver tags)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/nidingen-dashboard
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value={{date 'YYYYMMDD'}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # ── 3. Set up QEMU (for cross-platform builds) ───────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ── 4. Set up Docker Buildx ──────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 5. Log in to Docker Hub ──────────────────────────────────────────────
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 6. Build and push ────────────────────────────────────────────────────
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./app/Dockerfile
          platforms: linux/amd64          # Serve runs on amd64
          push: ${{ github.event_name != 'pull_request' }}   # pull requests only check that it builds
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha           # GitHub Actions layer cache
          cache-to: type=gha,mode=max
