[project]
name = "ringing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dash>=4.1.0",
    "dash-bootstrap-components>=2.0.4",
    "dotenv>=0.9.9",
    "duckdb>=1.5.2",
    "flask-caching>=2.4.0",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "plotly>=6.7.0",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "pyodbc>=5.3.0",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "streamlit>=1.57.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
# Most other files in app/tests are exploratory scripts that run on import
# (some against the legacy bird_ringing.db); only collect the real suites.
python_files = ["test_aggregates.py", "test_fetch_observations.py"]
